
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanzul - Cyberpunk Social & Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neonCyan: '#00f3ff',
            neonPink: '#ff007f',
            neonPurple: '#9d00ff',
            darkBg: '#090a0f',
            cardBg: '#121420',
          },
          boxShadow: {
            cyanGlow: '0 0 15px rgba(0, 243, 255, 0.4)',
            pinkGlow: '0 0 15px rgba(255, 0, 127, 0.4)',
            purpleGlow: '0 0 15px rgba(157, 0, 255, 0.4)',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #050608;
      color: #e2e8f0;
      overflow-x: hidden;
      user-select: none;
    }

    h1, h2, h3, .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #090a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #00f3ff;
      border-radius: 4px;
    }

    /* Glassmorphism & Neon styles */
    .glass-panel {
      background: rgba(18, 20, 32, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .glass-input {
      background: rgba(10, 12, 20, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #00f3ff;
    }

    .glass-input:focus {
      outline: none;
      border-color: #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .neon-text-cyan {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    .neon-text-pink {
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    .neon-border {
      border: 1px solid #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .neon-border-pink {
      border: 1px solid #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    /* Custom Hanzul Virtual Keyboard Styling matching reference photo */
    .hanzul-keyboard-bg {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(5,7,15,0.95)),
                  url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .key-btn:active {
      background: rgba(0, 243, 255, 0.5);
      transform: scale(0.92);
      box-shadow: 0 0 12px #00f3ff;
    }

    .pulse-offline {
      animation: pulseAlert 1.5s infinite;
    }

    @keyframes pulseAlert {
      0% { background-color: rgba(255, 0, 127, 0.9); }
      50% { background-color: rgba(180, 0, 80, 0.9); }
      100% { background-color: rgba(255, 0, 127, 0.9); }
    }
  </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex justify-center items-center p-0 md:p-4">

  <!-- Mobile Simulator Container -->
  <div class="w-full max-w-md h-screen md:h-[90vh] md:max-h-[850px] bg-darkBg md:rounded-3xl border-0 md:border-2 border-neonCyan/40 shadow-cyanGlow flex flex-col relative overflow-hidden">
    
    <!-- TOP OFFLINE BANNER (Appears when offline or simulated toggle) -->
    <div id="offline-banner" class="hidden pulse-offline text-white text-xs font-bold py-1.5 px-4 text-center tracking-widest z-50 flex items-center justify-center gap-2">
      <i data-lucide="wifi-off" class="w-4 h-4"></i>
      <span data-i18n="wifi_offline">CONECTE-SE AO WI-FI</span>
      <button onclick="toggleOfflineSim()" class="ml-auto text-[10px] bg-black/40 px-2 py-0.5 rounded border border-white/30">Simular On</button>
    </div>

    <!-- APP HEADER -->
    <header class="h-14 glass-panel px-4 flex items-center justify-between border-b border-neonCyan/30 z-30 shrink-0">
      <div class="flex items-center space-x-2">
        <h1 class="text-xl font-extrabold tracking-wider neon-text-cyan flex items-center gap-1.5">
          <span class="text-neonPink">H</span>ANZUL
        </h1>
        <span class="text-[10px] bg-neonPink/20 text-neonPink border border-neonPink/50 px-1.5 py-0.5 rounded font-mono">v2.5</span>
      </div>

      <div class="flex items-center space-x-2">
        <!-- System / Hanzul Keyboard Switch Floating Toggle Button -->
        <button id="kb-toggle-top-btn" onclick="toggleKeyboardMode()" class="px-2.5 py-1 text-xs rounded-full bg-neonCyan/20 border border-neonCyan text-neonCyan hover:bg-neonCyan hover:text-black transition flex items-center gap-1 shadow-cyanGlow">
          <i data-lucide="keyboard" class="w-3.5 h-3.5"></i>
          <span id="kb-mode-indicator">HANZUL KB</span>
        </button>

        <!-- Network Sim Toggle (For Testing offline bar) -->
        <button onclick="toggleOfflineSim()" class="p-1.5 rounded-lg text-gray-400 hover:text-neonCyan">
          <i data-lucide="wifi" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER / ADM) -->
    <div id="auth-screen" class="absolute inset-0 z-40 bg-darkBg flex flex-col justify-center items-center p-6">
      <div class="w-full glass-panel p-6 rounded-2xl border border-neonCyan/40 shadow-cyanGlow space-y-5 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-neonPink/20 rounded-full blur-2xl"></div>
        
        <div class="text-center space-y-1">
          <h2 class="text-3xl font-black neon-text-cyan">HANZUL</h2>
          <p class="text-xs text-gray-400" data-i18n="app_subtitle">REDE SOCIAL & CHAT CYBERPUNK</p>
        </div>

        <!-- Auth Tabs -->
        <div class="flex border-b border-gray-800 text-sm font-semibold">
          <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-2 text-center text-neonCyan border-b-2 border-neonCyan" data-i18n="auth_login">Entrar</button>
          <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 py-2 text-center text-gray-400" data-i18n="auth_register">Cadastrar</button>
          <button onclick="switchAuthTab('adm')" id="tab-adm" class="flex-1 py-2 text-center text-gray-400" data-i18n="auth_adm">Entrar como ADM</button>
        </div>

        <!-- Error / Status Message Alert Box -->
        <div id="auth-alert" class="hidden p-3 rounded-lg text-xs font-semibold bg-red-950/80 border border-red-500/50 text-red-300 text-center"></div>

        <!-- LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="username">Usuário</label>
            <input type="text" id="login-username" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="@usuario">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="password">Senha</label>
            <input type="password" id="login-password" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="••••••••">
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-neonCyan to-blue-600 text-black font-bold text-sm tracking-wide shadow-cyanGlow hover:brightness-110 active:scale-95 transition" data-i18n="btn_enter">ENTRAR</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="username">Nome de Usuário</label>
            <input type="text" id="reg-username" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="Ex: cyber_warrior">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="display_name">Nome de Exibição</label>
            <input type="text" id="reg-displayname" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="Ex: Alex Cyber">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="password">Senha</label>
            <input type="password" id="reg-password" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="••••••••">
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-neonPink to-purple-600 text-white font-bold text-sm tracking-wide shadow-pinkGlow hover:brightness-110 active:scale-95 transition" data-i18n="btn_create_account">CRIAR CONTA</button>
        </form>

        <!-- ADMIN LOGIN FORM -->
        <form id="form-adm" onsubmit="handleAdmLogin(event)" class="space-y-4 hidden">
          <div class="p-2.5 bg-amber-950/40 border border-amber-500/30 rounded-lg text-amber-300 text-[11px] flex items-center gap-2">
            <i data-lucide="shield-alert" class="w-4 h-4 shrink-0"></i>
            <span data-i18n="adm_notice">Acesso restrito para administradores do Hanzul.</span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="adm_user">Usuário ADM</label>
            <input type="text" id="adm-username" value="admin" required class="w-full p-2.5 rounded-lg glass-input text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="adm_secret_key">Chave de Segurança Secreta</label>
            <input type="password" id="adm-password" required class="w-full p-2.5 rounded-lg glass-input text-sm" placeholder="Senha secreta de ADM">
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-red-600 to-amber-600 text-white font-bold text-sm tracking-wide shadow-purpleGlow hover:brightness-110 active:scale-95 transition" data-i18n="btn_enter_adm">ACESSAR PAINEL ADM</button>
        </form>

      </div>
    </div>

    <!-- MAIN CONTENT VIEW CONTAINER -->
    <main id="main-view" class="flex-1 overflow-y-auto relative p-3 pb-20 space-y-4">
      
      <!-- TAB 1: HOME FEED (CASINHA) -->
      <section id="sec-home" class="space-y-4">
        <!-- Create Quick Post Box -->
        <div class="glass-panel p-3.5 rounded-xl border border-neonCyan/30 space-y-3">
          <div class="flex items-center gap-2.5">
            <img id="feed-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-9 h-9 rounded-full border border-neonCyan object-cover">
            <input type="text" id="quick-post-text" onfocus="handleInputFocus(this)" class="glass-input flex-1 px-3 py-2 rounded-lg text-sm" placeholder="O que está acontecendo?" data-i18n="whats_happening">
          </div>
          <div class="flex justify-between items-center pt-1 border-t border-gray-800 text-xs text-gray-400">
            <div class="flex gap-3">
              <button onclick="triggerFileInput('image')" class="hover:text-neonCyan flex items-center gap-1"><i data-lucide="image" class="w-4 h-4"></i> <span data-i18n="photo">Foto</span></button>
              <button onclick="triggerFileInput('video')" class="hover:text-neonPink flex items-center gap-1"><i data-lucide="video" class="w-4 h-4"></i> <span data-i18n="video">Vídeo</span></button>
              <button onclick="triggerFileInput('screenshot')" class="hover:text-neonPurple flex items-center gap-1"><i data-lucide="camera" class="w-4 h-4"></i> <span data-i18n="print">Print</span></button>
            </div>
            <button onclick="publishPost()" class="px-4 py-1.5 rounded-lg bg-neonCyan text-black font-bold shadow-cyanGlow hover:brightness-110" data-i18n="btn_post">Postar</button>
          </div>
        </div>

        <!-- Posts Feed List -->
        <div id="posts-feed" class="space-y-4">
          <!-- Posts rendered via JS -->
        </div>
      </section>

      <!-- TAB 2: SEARCH USERS -->
      <section id="sec-search" class="space-y-4 hidden">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 text-gray-400"></i>
          <input type="text" id="search-input" oninput="renderUserSearch()" onfocus="handleInputFocus(this)" class="w-full glass-input pl-9 pr-4 py-2.5 rounded-xl text-sm" placeholder="Pesquisar usuários no Hanzul..." data-i18n="search_placeholder">
        </div>
        <div id="search-results" class="space-y-2">
          <!-- User cards rendered via JS -->
        </div>
      </section>

      <!-- TAB 3: ADD POST (+ MODAL / VIEW) -->
      <section id="sec-add" class="space-y-4 hidden">
        <div class="glass-panel p-4 rounded-xl border border-neonPink/40 space-y-4">
          <h3 class="text-base font-bold neon-text-pink flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span data-i18n="new_publication">Nova Publicação</span>
          </h3>
          <textarea id="full-post-text" onfocus="handleInputFocus(this)" class="w-full h-28 glass-input p-3 rounded-xl text-sm resize-none" placeholder="Escreva o conteúdo da publicação..." data-i18n="write_post"></textarea>
          
          <div class="space-y-2">
            <label class="block text-xs text-gray-400 font-semibold" data-i18n="media_attachment">Anexo de Mídia (Foto / Vídeo / Print)</label>
            <input type="file" id="media-upload-input" accept="image/*,video/*" onchange="previewMediaUpload(event)" class="hidden">
            <div onclick="document.getElementById('media-upload-input').click()" class="border-2 border-dashed border-neonCyan/40 hover:border-neonCyan rounded-xl p-6 text-center cursor-pointer bg-darkBg/50 hover:bg-neonCyan/5 transition">
              <i data-lucide="upload-cloud" class="w-8 h-8 text-neonCyan mx-auto mb-2"></i>
              <p id="media-upload-label" class="text-xs text-gray-300" data-i18n="click_upload">Clique para carregar Foto, Vídeo ou Print</p>
            </div>
            <div id="media-preview-container" class="hidden relative rounded-xl overflow-hidden border border-neonCyan/40">
              <img id="media-preview-img" class="w-full max-h-48 object-cover hidden">
              <video id="media-preview-vid" controls class="w-full max-h-48 object-cover hidden"></video>
            </div>
          </div>

          <button onclick="publishFullPost()" class="w-full py-3 rounded-xl bg-gradient-to-r from-neonPink via-purple-600 to-neonCyan text-white font-bold text-sm shadow-pinkGlow hover:brightness-110" data-i18n="btn_publish">PUBLICAR AGORA</button>
        </div>
      </section>

      <!-- TAB 4: DIRECT MESSAGES (CHAT) -->
      <section id="sec-messages" class="space-y-4 hidden">
        <!-- Contact List View -->
        <div id="chat-list-view" class="space-y-3">
          <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider" data-i18n="messages_title">Mensagens Diretas</h3>
          <div id="contacts-list" class="space-y-2">
            <!-- Contact list generated via JS -->
          </div>
        </div>

        <!-- Chat Conversation Screen (Hidden by default) -->
        <div id="chat-room-view" class="hidden h-[calc(100vh-170px)] md:h-[650px] flex flex-col glass-panel rounded-2xl border border-neonCyan/30 overflow-hidden">
          <div class="p-3 bg-cardBg border-b border-neonCyan/30 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="closeChatRoom()" class="p-1 hover:text-neonCyan"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
              <img id="chat-header-avatar" src="" class="w-8 h-8 rounded-full border border-neonCyan object-cover">
              <div>
                <h4 id="chat-header-name" class="text-sm font-bold leading-none text-white">---</h4>
                <span id="chat-header-status" class="text-[10px] text-neonCyan">Online</span>
              </div>
            </div>
          </div>

          <!-- Chat Messages Area -->
          <div id="chat-messages-body" class="flex-1 p-3 overflow-y-auto space-y-3 bg-darkBg/60">
            <!-- Chat bubbles dynamically generated -->
          </div>

          <!-- Chat Input Bar -->
          <div class="p-2.5 bg-cardBg border-t border-neonCyan/30 flex items-center gap-2">
            <input type="text" id="chat-input-text" onfocus="handleInputFocus(this)" class="glass-input flex-1 px-3 py-2 rounded-xl text-sm" placeholder="Digite uma mensagem..." data-i18n="type_message">
            <button onclick="sendChatMessage()" class="p-2 rounded-xl bg-neonCyan text-black font-bold shadow-cyanGlow"><i data-lucide="send" class="w-4 h-4"></i></button>
          </div>
        </div>
      </section>

      <!-- TAB 5: USER PROFILE -->
      <section id="sec-profile" class="space-y-4 hidden">
        <div class="glass-panel p-4 rounded-2xl border border-neonCyan/30 relative overflow-hidden space-y-4">
          <div class="flex items-start justify-between">
            <div class="flex gap-3">
              <div class="relative">
                <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-16 h-16 rounded-full border-2 border-neonCyan object-cover shadow-cyanGlow">
                <button onclick="openEditProfileModal()" class="absolute bottom-0 right-0 p-1 bg-neonPink rounded-full text-white text-[10px] shadow-pinkGlow"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
              </div>
              <div>
                <h3 id="profile-display-name" class="text-lg font-bold text-white">---</h3>
                <p id="profile-handle" class="text-xs text-neonCyan font-mono">@---</p>
                <span id="profile-role-badge" class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] bg-neonCyan/20 border border-neonCyan/50 text-neonCyan font-bold">Membro</span>
              </div>
            </div>
            <button onclick="openSettingsModal()" class="p-2 rounded-xl glass-panel hover:border-neonCyan text-gray-300 hover:text-neonCyan"><i data-lucide="settings" class="w-5 h-5"></i></button>
          </div>

          <p id="profile-bio" class="text-xs text-gray-300 italic border-l-2 border-neonPink pl-2 py-0.5">---</p>

          <!-- Follower & Post Counters -->
          <div class="flex justify-around py-2 bg-darkBg/60 rounded-xl border border-gray-800 text-center">
            <div>
              <span id="stat-posts-count" class="block text-base font-bold text-neonCyan">0</span>
              <span class="text-[10px] text-gray-400 uppercase" data-i18n="posts">Posts</span>
            </div>
            <div class="border-r border-gray-800"></div>
            <div>
              <span id="stat-followers-count" class="block text-base font-bold text-neonPink">0</span>
              <span class="text-[10px] text-gray-400 uppercase" data-i18n="followers">Seguidores</span>
            </div>
            <div class="border-r border-gray-800"></div>
            <div>
              <span id="stat-following-count" class="block text-base font-bold text-neonCyan">0</span>
              <span class="te
